name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Same toolchain as development: Xcode 27 with Swift 6.4, whose default
    # build system (Swift Build) scripts/sync-strings.sh relies on.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Check that string catalogs are in sync
        run: |
          ./scripts/sync-strings.sh
          git diff --exit-code

      - name: Build app
        run: ./scripts/build-app.sh release
