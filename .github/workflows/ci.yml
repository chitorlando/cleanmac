name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Same toolchain as development: Xcode 27 with Swift 6.4, whose default
    # build system (Swift Build) scripts/sync-strings.sh relies on.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Check that string catalogs are in sync
        run: |
          ./scripts/sync-strings.sh
          git diff --exit-code

      # The runners are Apple silicon. Building for Intel too makes the result
      # usable on every Mac the app supports.
      - name: Build universal app
        run: ./scripts/build-app.sh release arm64 x86_64

      - name: Check that the app is universal
        run: |
          executable=build/CleanMac.app/Contents/MacOS/CleanMac
          # The lipo of Xcode 27 fails on -verify_arch with two architectures
          # ("requires exactly one input file"), so the list it prints is
          # checked instead.
          architectures="$(lipo -archs "$executable")"
          echo "$architectures"
          for architecture in arm64 x86_64; do
            if ! grep -qw "$architecture" <<<"$architectures"; then
              echo "::error::CleanMac.app lacks the $architecture architecture."
              exit 1
            fi
          done
          # For whoever reads the log: the minimum macOS and the libraries of
          # each slice decide whether the app starts on an older Mac.
          vtool -show-build "$executable"
          otool -arch all -L "$executable"
          # Sparkle is a dynamic framework and must travel inside the app.
          framework=build/CleanMac.app/Contents/Frameworks/Sparkle.framework
          test -x "$framework/Sparkle"
          lipo -archs "$framework/Sparkle"
          codesign --verify --deep --strict build/CleanMac.app

      # Artifacts keep neither the executable bit nor symlinks, and a ditto
      # archive does, so the app is uploaded inside one. --sequesterRsrc puts
      # any extended attributes beside the bundle instead of inside it, where
      # a plain unzip would leave files that break the signature.
      - name: Archive app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/CleanMac.app build/CleanMac.app.zip
          # What gets downloaded has to unpack into an app that still runs
          # and still has a valid signature.
          unpacked="$(mktemp -d)"
          ditto -x -k build/CleanMac.app.zip "$unpacked"
          test -x "$unpacked/CleanMac.app/Contents/MacOS/CleanMac"
          codesign --verify --deep --strict --verbose=2 "$unpacked/CleanMac.app"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: CleanMac-universal
          path: build/CleanMac.app.zip
          if-no-files-found: error
          retention-days: 14
          # ditto has already compressed it.
          compression-level: 0
