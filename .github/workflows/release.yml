name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Serialize publications so an older build cannot replace the latest release
# while a newer one is being uploaded. Never interrupt signing or publication.
concurrency:
  group: cleanmac-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish free distribution
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app
          swift --version

      - name: Validate release inputs
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Missing SPARKLE_PRIVATE_KEY secret'; exit 1; }
          # Keep public build numbers above local development's build 1.
          ./scripts/set-release-version.sh "$GITHUB_REF_NAME" "$((GITHUB_RUN_NUMBER + 1000))"
          test -s "releases/$GITHUB_REF_NAME.en.html"
          test -s "releases/$GITHUB_REF_NAME.es.html"

      - name: Test
        run: swift test

      - name: Build universal app
        run: ./scripts/build-app.sh release arm64 x86_64

      - name: Verify architectures and signatures
        run: |
          for executable in \
            build/CleanMac.app/Contents/MacOS/CleanMac \
            build/CleanMac.app/Contents/Frameworks/Sparkle.framework/Sparkle; do
            architectures="$(lipo -archs "$executable")"
            for architecture in arm64 x86_64; do
              grep -qw "$architecture" <<<"$architectures"
            done
          done
          codesign --verify --deep --strict build/CleanMac.app

      - name: Create DMG
        run: ./scripts/build-dmg.sh

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/build-appcast.sh "$GITHUB_REF_NAME"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CleanMac-${{ github.ref_name }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish release after all files are ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft keeps the feed invisible until all assets are uploaded.
          # A rerun must not silently replace an already published update.
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "CleanMac ${GITHUB_REF_NAME#v}" \
            --notes-file releases/INSTALL.md \
            build/release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
